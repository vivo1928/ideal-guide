name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-23" "build-tools;28.0.3"
          yes | sdkmanager --licenses

      - name: Build APK
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

      - name: Verify release signature
        run: |
          if [ -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}" ]; then
            echo "Signed with RELEASE key (injected from secrets)"
          else
            echo "Signed with DEBUG key"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: domestic-music-source-apk
          path: build/out/domestic-music-source.apk
